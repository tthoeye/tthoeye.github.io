---
layout: default
bodyClass: "page-faq"
---

<div class="intro">
  <div class="container">
    <div class="row justify-content-start">
      <div class="col-12"> <!-- full width now -->
        {{ content }}
      </div>
    </div>
  </div>
</div>

<div class="container pt-6 pb-6">
  <div class="row">
    <div class="col-12"> <!-- full width now -->
      {% assign faq_items = site.faq | sort: 'weight' %}
      {% if faq_items.size > 0 %}
        {% for item in faq_items %}
        <article class="faq-item mb-4">
          <h2 class="faq-item__title">{{ item.title }}</h2>
          <div class="faq-item__content">
            {{ item.content | markdownify }}
          </div>
        </article>
        {% endfor %}
      {% else %}
        <div class="faq-empty-state">
          <p>No FAQ entries have been published yet.</p>
        </div>
      {% endif %}
    </div>
  </div>
</div>
